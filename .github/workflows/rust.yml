name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: showcase/tauri/sidecar/package-lock.json
    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
    - name: Install sidecar dependencies
      run: npm ci
      working-directory: showcase/tauri/sidecar
    # One entry point, the same one CI and releases use: build.sh syncs the web files into dist/ (the shell's
    # frontendDist), bundles the sidecar, builds the voice and Linux input helpers the app bundles and then
    # compiles the debug shell. Assembling any of those here separately drifts from it.
    - name: Build
      run: ./build.sh dev
      working-directory: showcase/tauri
    - name: Run tests
      run: cargo test --verbose --manifest-path showcase/tauri/src-tauri/voice-win/Cargo.toml
