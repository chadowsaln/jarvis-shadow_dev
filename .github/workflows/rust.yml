name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
    - name: Build
      run: cargo check --verbose --manifest-path showcase/tauri/src-tauri/Cargo.toml
    - name: Run tests
      run: cargo test --verbose --manifest-path showcase/tauri/src-tauri/voice-win/Cargo.toml
