[package]
name = "roamies-input"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Linux input injection for JARVIS V2 through the XDG desktop portal and libei"

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.14.3", default-features = false, features = ["remote_desktop", "screencast", "tokio"] }
reis = "=0.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
libc = "0.2"
